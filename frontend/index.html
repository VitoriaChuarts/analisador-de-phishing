<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analisador de Phishing</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="lateral">
      <div class="perfil">
        <div class="avatar" aria-hidden="true">🛡️</div>
        <strong>Analisador</strong>
        <small>de Phishing</small>
      </div>
      <nav>
        <a href="#aba-url" data-aba="url" class="ativo">Analisar URL</a>
        <a href="#aba-email" data-aba="email">Analisar e-mail</a>
        <a href="#historico-secao">Histórico</a>
      </nav>
    </aside>

    <main>
      <section id="aba-url">
        <h1>Painel de Análise</h1>
        <p class="sub">Escreva a URL para análise:</p>

        <form id="form">
          <input id="url" type="text" placeholder="https://exemplo.com" required>
          <label>
            <input id="rede" type="checkbox" checked>
            <span>Consultar informações da rede</span>
          </label>
          <button id="botao" type="submit">Analisar</button>
        </form>
      </section>

      <section id="aba-email" hidden>
        <h1>Análise de e-mail</h1>
        <p class="sub">Envie um arquivo .eml (até 2 MB):</p>

        <form id="form-email">
          <input id="arquivo" type="file" accept=".eml" required>
          <label>
            <input id="rede-email" type="checkbox">
                        <span>Consultar informações da rede</span>
          </label>
          <button id="botao-email" type="submit">Analisar e-mail</button>
        </form>
      </section>

      <p id="mensagem" role="status"></p>

      <section id="resultado" hidden>
        <div id="anel" class="anel">
          <span id="pontuacao">0</span>
        </div>
        <div class="detalhes">
          <div class="cabecalho">
            <span>Nível de Phishing:</span>
            <span id="nivel" class="badge"></span>
          </div>
          <p id="url-analisada"></p>
          <h3 id="titulo-sinais" hidden>Sinais do cabeçalho</h3>
          <ul id="sinais"></ul>
          <h3 id="titulo-links" hidden>Links encontrados</h3>
          <ul id="links" hidden></ul>
        </div>
      </section>

      <section id="historico-secao">
        <h2>Histórico</h2>
        <div class="tabela">
          <table>
            <thead>
              <tr><th>Data</th><th>URL</th><th>Pontos</th><th>Nível</th></tr>
            </thead>
            <tbody id="historico"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
